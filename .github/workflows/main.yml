name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Run Pylint
        run: uv run pylint src

      - name: Run main tests
        run: uv run coverage run --branch -m pytest src/tests

      - name: Run maksukortti tests
        working-directory: viikko4/maksukortti-mock
        run: uv run --project ../.. pytest

      - name: Run verkkokauppa tests
        working-directory: viikko4/verkkokauppa
        run: uv run --project ../.. pytest

      - name: Coverage report
        run: uv run coverage xml
      - name: Coverage report to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

